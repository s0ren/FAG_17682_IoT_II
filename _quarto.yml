project:
  title: "FAG 17682_IoT_II"
  type: website
  output-dir: output
  # Kun .qmd-filer bygges; .md-filer (fx todo.md) er noter
  render:
    - "**/*.qmd"
  # Sætter filernes ændringstid til sidste commit, så "Ændret" passer
  pre-render: _scripts/git_mtime.py

website:
  navbar:
    left:
      - href: index.qmd
        text: Hjem
      - href: laeringsmaal.qmd
        text: Læringsmål
      - href: about.qmd
        text: Om sitet
  sidebar:
    contents: auto
    background: gray
  draft-mode: unlinked

# Fælles for alle sider og alle formater (HTML og PDF)
lang: da
toc: true
# Ændringsdato: sidste commit (via _scripts/git_mtime.py). Oprettelsesdato (date:) står på hver side.
date-modified: last-modified
date-format: long
# template-partials (PDF) står i Opgaver/_metadata.yml, fordi revealjs-slides afviser den.
# Sidemargener i PDF (Typst). HTML bruger dem ikke; slides sætter deres egen margin.
margin:
  top: 1cm
  right: 1cm
  bottom: 1.5cm
  left: 1.5cm
author:
  - name: Søren Magnusson
    affiliation: Data, TEC
# Quartos danske overskrift over affiliation er "Tilknytning"
language:
  title-block-affiliation-single: Uddannelse
  title-block-affiliation-plural: Uddannelser

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    lightbox: true
